<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes API Client</h1>
    <p>Connected to the JSONPlaceholder practice API.</p>
  </header>

  <main>
    <section class="card">
      <h2>Load notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status"></p>
    </section>

    <section class="card">
      <h2>Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title (required, up to 100 characters)</label>
        <input type="text" id="title-input" placeholder="Give your note a title">

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" rows="4" placeholder="Write your note..."></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="card">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
